name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    needs: publish
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config
          cargo build --release

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/clean-mount
          generate_release_notes: true
